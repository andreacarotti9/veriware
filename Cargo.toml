[workspace]
members = [
    "core",
    "fixtures/generator",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andreacarotti9/veriware"

# Exact pins: certificate formats are a wire contract. See docs/versions.md.
[workspace.dependencies]
veriware-core = { version = "0.1.0", path = "core" }
alto-types = "=2026.7.1"
commonware-codec = "=2026.7.0"
commonware-consensus = "=2026.7.0"
commonware-cryptography = "=2026.7.0"
commonware-parallel = "=2026.7.0"
commonware-utils = "=2026.7.0"
rand = "=0.10.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[profile.bench]
overflow-checks = true

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
codegen-units = 1
lto = true
panic = "abort"

[profile.test]
overflow-checks = true
